<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>临时邮箱 · Temp Mail</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    width: 560px;
    max-width: 100%;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
    padding: 36px 30px 30px;
  }

  /* ===== 头部 ===== */
  .header { text-align: center; margin-bottom: 28px; }
  .header .icon-mail {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 28px; color: #fff;
    margin-bottom: 12px;
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
  }
  .header h1 { font-size: 22px; font-weight: 600; color: #1a2a3a; letter-spacing: 0.5px; }
  .header p { font-size: 13px; color: #7a8a9a; margin-top: 4px; }

  /* ===== 域名选择 ===== */
  .domain-pick { margin-bottom: 16px; }
  .domain-pick label { font-size: 13px; font-weight: 500; color: #2a3a4a; display: block; margin-bottom: 6px; }
  .domain-pick select {
    width: 100%; padding: 11px 14px;
    border: 1.5px solid #dce4ec; border-radius: 12px;
    font-size: 14px; color: #1a2a3a; background: #fafbfc;
    outline: none; cursor: pointer; transition: .25s;
  }
  .domain-pick select:focus { border-color: #667eea; box-shadow: 0 0 0 4px rgba(102,126,234,.1); }

  /* ===== 邮箱地址卡片 ===== */
  .addr-card {
    background: linear-gradient(135deg, #f0f4ff, #f8f0ff);
    border: 1.5px dashed #b8c4dd;
    border-radius: 16px;
    padding: 20px 16px;
    text-align: center;
    margin-bottom: 20px;
    word-break: break-all;
    position: relative;
  }
  .addr-card .label { font-size: 12px; color: #6a7a8a; margin-bottom: 6px; }
  .addr-card .value { font-size: 20px; font-weight: 600; color: #1a2a3a; letter-spacing: 0.3px; }
  .addr-card .copy-btn {
    margin-top: 10px;
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; color: #667eea; cursor: pointer;
    background: none; border: none; font-weight: 500;
  }
  .addr-card .copy-btn:hover { color: #4a5ec0; }

  /* ===== 状态指示 ===== */
  .status-row {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; margin-bottom: 16px; font-size: 13px; color: #6a7a8a;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ccc; transition: .3s;
  }
  .dot.live { background: #22c55e; box-shadow: 0 0 0 4px rgba(34,197,94,.15); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

  /* ===== 收件箱 ===== */
  .inbox {
    max-height: 300px; overflow-y: auto;
    border: 1px solid #eef2f6; border-radius: 14px;
    background: #fcfdff; margin-bottom: 18px;
  }
  .inbox::-webkit-scrollbar { width: 6px; }
  .inbox::-webkit-scrollbar-thumb { background: #d0d8e0; border-radius: 3px; }

  .mail-item {
    padding: 14px 16px;
    border-bottom: 1px solid #f0f3f8;
    cursor: pointer; transition: .15s;
  }
  .mail-item:last-child { border-bottom: none; }
  .mail-item:hover { background: #f0f4ff; }
  .mail-item.unread { background: #f0f4ff; border-left: 3px solid #667eea; padding-left: 13px; }
  .mail-item .from { font-weight: 530; color: #1a2a3a; font-size: 14px; }
  .mail-item .subject { color: #4a5a6a; font-size: 13px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mail-item .time { font-size: 11px; color: #8a9aaa; float: right; margin-top: 2px; }
  .mail-item .preview { color: #8a9aaa; font-size: 12px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .no-mails { padding: 50px 20px; text-align: center; color: #8a9aaa; font-size: 14px; }
  .no-mails .big-emoji { font-size: 36px; margin-bottom: 10px; }

  /* ===== 按钮 ===== */
  .btn-group { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
  .btn {
    padding: 11px 24px; border-radius: 60px; font-size: 14px; font-weight: 510;
    cursor: pointer; transition: .2s; border: none;
  }
  .btn-primary {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; box-shadow: 0 4px 14px rgba(102,126,234,.4);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(102,126,234,.5); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

  .btn-outline {
    background: #fff; border: 1.5px solid #dce4ec; color: #2a3a4a;
  }
  .btn-outline:hover { background: #f5f8fc; border-color: #b8c8dd; }
  .btn-outline:disabled { opacity: .4; cursor: not-allowed; }

  .btn-danger {
    background: #fff; border: 1.5px solid #f5c6cb; color: #c82020;
  }
  .btn-danger:hover { background: #fff5f5; }
  .btn-danger:disabled { opacity: .4; cursor: not-allowed; }

  /* ===== 提示消息 ===== */
  .msg { margin-top: 16px; padding: 10px 14px; border-radius: 12px; font-size: 13px; display: none; text-align: center; }
  .msg.show { display: block; }
  .msg.error { background: #fff0ee; color: #b02020; border: 1px solid #fcdad6; }
  .msg.success { background: #ebf8ed; color: #1a7a2a; border: 1px solid #c6eacb; }
  .msg.info { background: #eef4fa; color: #1a4a7a; border: 1px solid #ccddee; }

  /* ===== 邮件详情弹窗 ===== */
  .overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,.4); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 999;
  }
  .overlay.show { display: flex; }
  .modal {
    background: #fff; border-radius: 20px; padding: 28px 30px 24px;
    max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  .modal h3 { font-size: 17px; margin-bottom: 8px; color: #1a2a3a; word-break: break-word; }
  .modal .meta { font-size: 12px; color: #8a9aaa; margin-bottom: 14px; }
  .modal .body {
    font-size: 14px; color: #2a3a4a; line-height: 1.7;
    background: #f8fafc; padding: 16px; border-radius: 12px;
    border: 1px solid #eef2f6; white-space: pre-wrap; word-break: break-word;
  }
  .modal .close-btn {
    margin-top: 16px; width: 100%; padding: 10px;
    background: #f0f3f8; border: none; border-radius: 30px;
    font-size: 14px; cursor: pointer; color: #2a3a4a;
  }
  .modal .close-btn:hover { background: #e4eaf2; }

  /* ===== Footer ===== */
  .footer { text-align: center; margin-top: 20px; font-size: 11px; color: #a0aec0; }
  .footer a { color: #667eea; text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    .card { padding: 24px 18px; border-radius: 18px; }
    .header h1 { font-size: 19px; }
    .addr-card .value { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="card">
  <!-- 头部 -->
  <div class="header">
    <div class="icon-mail">📬</div>
    <h1>临时邮箱</h1>
    <p>免费 · 匿名 · 即用即弃</p>
  </div>

  <!-- 域名选择 -->
  <div class="domain-pick">
    <label for="domainSelect">📌 选择域名</label>
    <select id="domainSelect">
      <option value="">— 点击"生成邮箱"自动获取可用域名 —</option>
    </select>
  </div>

  <!-- 邮箱地址 -->
  <div class="addr-card" id="addrCard">
    <div class="label">你的临时邮箱地址</div>
    <div class="value" id="emailAddr">—</div>
    <button class="copy-btn" id="copyBtn" style="display:none;">📋 复制地址</button>
  </div>

  <!-- 状态 -->
  <div class="status-row">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">尚未生成邮箱</span>
  </div>

  <!-- 收件箱 -->
  <div class="inbox" id="inbox">
    <div class="no-mails" id="noMailMsg">
      <div class="big-emoji">📭</div>
      <div>点击下方按钮生成邮箱<br/>等待邮件自动送达…</div>
    </div>
    <div id="mailList" style="display:none;"></div>
  </div>

  <!-- 操作按钮 -->
  <div class="btn-group">
    <button class="btn btn-primary" id="genBtn">✨ 生成邮箱</button>
    <button class="btn btn-outline" id="refreshBtn" disabled>🔄 刷新</button>
    <button class="btn btn-danger" id="deleteBtn" disabled>🗑️ 销毁</button>
  </div>

  <!-- 提示 -->
  <div class="msg" id="msgBox"></div>

  <!-- Footer -->
  <div class="footer">
    Powered by <a href="https://mail.tm" target="_blank" rel="noopener">Mail.tm</a> · 仅供合法用途
  </div>
</div>

<!-- 邮件详情弹窗 -->
<div class="overlay" id="mailModal">
  <div class="modal">
    <h3 id="modalSubject">主题</h3>
    <div class="meta" id="modalMeta"></div>
    <div class="body" id="modalBody">内容</div>
    <button class="close-btn" id="closeModalBtn">关闭</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  const API = 'https://api.mail.tm';
  const $ = (id) => document.getElementById(id);

  // 状态
  let emailAddress = '';
  let token = '';
  let accountId = '';
  let pollTimer = null;
  let knownIds = new Set(); // 已见过的邮件ID，用于检测新邮件

  // ===== 工具函数 =====
  function showMsg(text, type = 'info') {
    const m = $('msgBox');
    m.className = 'msg show ' + type;
    m.textContent = text;
    setTimeout(() => { m.className = 'msg'; m.textContent = ''; }, 4000);
  }

  function randomStr(len = 10) {
    const c = 'abcdefghijklmnopqrstuvwxyz0123456789';
    let s = '';
    for (let i = 0; i < len; i++) s += c.charAt(Math.floor(Math.random() * c.length));
    return s;
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function stripHtml(html) {
    const t = document.createElement('div');
    t.innerHTML = html;
    return t.textContent || t.innerText || '';
  }

  function timeAgo(iso) {
    const diff = Date.now() - new Date(iso).getTime();
    const min = Math.floor(diff / 60000);
    if (min < 1) return '刚刚';
    if (min < 60) return min + '分钟前';
    const h = Math.floor(min / 60);
    if (h < 24) return h + '小时前';
    return new Date(iso).toLocaleString();
  }

  // ===== 状态指示 =====
  function setStatus(text, live = false) {
    $('statusText').textContent = text;
    $('statusDot').className = 'dot' + (live ? ' live' : '');
  }

  // ===== 拉取可用域名 =====
  async function fetchDomains() {
    const r = await fetch(API + '/domains');
    if (!r.ok) throw new Error('获取域名列表失败 (HTTP ' + r.status + ')');
    const d = await r.json();
    const members = d['hydra:member'] || [];
    if (!members.length) throw new Error('当前无可用域名');
    const sel = $('domainSelect');
    sel.innerHTML = '';
    members.forEach(dom => {
      const o = document.createElement('option');
      o.value = dom.domain;
      o.textContent = dom.domain + (dom.isPrivate ? '（私有）' : '');
      sel.appendChild(o);
    });
    return members.map(m => m.domain);
  }

  // ===== 创建临时邮箱 =====
  async function createTempMail() {
    try {
      showMsg('正在获取可用域名…', 'info');
      const domains = await fetchDomains();

      let chosen = $('domainSelect').value;
      if (!chosen) {
        chosen = domains[Math.floor(Math.random() * domains.length)];
        $('domainSelect').value = chosen;
      }

      const address = randomStr(10) + '@' + chosen;
      const password = 'pwd_' + randomStr(8);

      showMsg('正在创建账户 ' + address + ' …', 'info');

      const res = await fetch(API + '/accounts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ address, password })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err['hydra:description'] || ('创建失败 (HTTP ' + res.status + ')'));
      }

      const acc = await res.json();
      accountId = acc.id;
      emailAddress = acc.address;

      const tk = await fetch(API + '/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ address, password })
      });
      if (!tk.ok) throw new Error('获取令牌失败');
      token = (await tk.json()).token;

      // 更新 UI
      $('emailAddr').textContent = emailAddress;
      $('copyBtn').style.display = 'inline-flex';
      $('genBtn').textContent = '🔄 重新生成';
      $('refreshBtn').disabled = false;
      $('deleteBtn').disabled = false;
      setStatus('监听中 — 每 8 秒自动检查', true);
      showMsg('✅ 邮箱已创建：' + emailAddress, 'success');

      knownIds.clear();
      await fetchInbox();
      startPolling();
    } catch (err) {
      console.error(err);
      showMsg('⚠️ ' + err.message, 'error');
      setStatus('创建失败，请重试');
    }
  }

  // ===== 拉取收件箱 =====
  async function fetchInbox() {
    if (!token) return;
    try {
      const res = await fetch(API + '/messages', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (!res.ok) {
        if (res.status === 401) {
          showMsg('会话已过期，请重新生成邮箱', 'error');
          destroyAll();
          return;
        }
        throw new Error('HTTP ' + res.status);
      }
      const data = await res.json();
      const messages = data['hydra:member'] || [];

      // 检测新邮件
      const newOnes = messages.filter(m => !knownIds.has(m.id));
      if (newOnes.length > 0 && knownIds.size > 0) {
        showMsg('📬 收到 ' + newOnes.length + ' 封新邮件！', 'success');
      }
      messages.forEach(m => knownIds.add(m.id));

      renderInbox(messages);
    } catch (err) {
      console.warn('拉取失败', err);
    }
  }

  // ===== 渲染邮件列表 =====
  function renderInbox(messages) {
    if (!messages.length) {
      $('noMailMsg').style.display = 'block';
      $('mailList').style.display = 'none';
      $('mailList').innerHTML = '';
      setStatus('监听中 — 等待邮件…', true);
      return;
    }

    $('noMailMsg').style.display = 'none';
    $('mailList').style.display = 'block';

    let html = '';
    messages.forEach(msg => {
      const from = msg.from ? (msg.from.name || msg.from.address) : '未知';
      const subject = msg.subject || '(无主题)';
      const preview = msg.preview || msg.intro || '';
      const time = timeAgo(msg.createdAt);
      const unread = !msg.seen ? 'unread' : '';
      html += `
        <div class="mail-item ${unread}" data-id="${msg.id}">
          <span class="time">${time}</span>
          <div class="from">${escapeHtml(from)}</div>
          <div class="subject">${escapeHtml(subject)}</div>
          <div class="preview">${escapeHtml(preview)}</div>
        </div>`;
    });
    $('mailList').innerHTML = html;
    setStatus('📬 ' + messages.length + ' 封邮件 · 实时监听中', true);

    document.querySelectorAll('.mail-item').forEach(el => {
      el.addEventListener('click', () => showMailDetail(el.dataset.id));
    });
  }

  // ===== 查看邮件详情 =====
  async function showMailDetail(msgId) {
    if (!token) return;
    try {
      const res = await fetch(API + '/messages/' + msgId, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (!res.ok) throw new Error('获取邮件失败');
      const msg = await res.json();

      let body = '';
      if (msg.html && msg.html.length > 0) {
        body = msg.html.map(stripHtml).join('\n\n');
      } else if (msg.text) {
        body = msg.text;
      } else {
        body = '(无内容)';
      }

      const from = msg.from ? (msg.from.name || msg.from.address) : '未知';
      $('modalSubject').textContent = msg.subject || '(无主题)';
      $('modalMeta').textContent = '发件人：' + from + '  ·  ' + new Date(msg.createdAt).toLocaleString();
      $('modalBody').textContent = body;
      $('mailModal').classList.add('show');

      // 标记为已读后刷新列表
      if (!msg.seen) fetchInbox();
    } catch (err) {
      showMsg('无法加载邮件详情', 'error');
    }
  }

  // ===== 销毁邮箱 =====
  async function deleteTempMail() {
    if (!accountId || !token) return;
    try {
      const res = await fetch(API + '/accounts/' + accountId, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.ok || res.status === 404) {
        showMsg('🗑️ 邮箱已销毁', 'info');
      }
    } catch (err) {
      console.warn(err);
    }
    destroyAll();
  }

  function destroyAll() {
    stopPolling();
    emailAddress = ''; token = ''; accountId = '';
    knownIds.clear();
    $('emailAddr').textContent = '—';
    $('copyBtn').style.display = 'none';
    $('genBtn').textContent = '✨ 生成邮箱';
    $('refreshBtn').disabled = true;
    $('deleteBtn').disabled = true;
    $('noMailMsg').style.display = 'block';
    $('mailList').style.display = 'none';
    $('mailList').innerHTML = '';
    setStatus('尚未生成邮箱');
  }

  // ===== 轮询 =====
  function startPolling() {
    stopPolling();
    pollTimer = setInterval(() => { if (token) fetchInbox(); }, 8000);
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  // ===== 复制地址 =====
  $('copyBtn').addEventListener('click', function () {
    if (!emailAddress) return;
    const text = emailAddress;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => showMsg('📋 已复制到剪贴板', 'success'));
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove();
      showMsg('📋 已复制', 'success');
    }
  });

  // ===== 按钮事件 =====
  $('genBtn').addEventListener('click', function () {
    if (emailAddress) {
      if (!confirm('确定要销毁当前邮箱并重新生成吗？')) return;
      deleteTempMail().then(() => setTimeout(() => createTempMail(), 300));
    } else {
      createTempMail();
    }
  });

  $('refreshBtn').addEventListener('click', function () {
    if (token) { fetchInbox(); showMsg('🔄 已刷新收件箱', 'info'); }
  });

  $('deleteBtn').addEventListener('click', function () {
    if (confirm('确定要销毁当前临时邮箱吗？销毁后无法恢复。')) {
      deleteTempMail();
    }
  });

  // 关闭弹窗
  $('closeModalBtn').addEventListener('click', () => $('mailModal').classList.remove('show'));
  $('mailModal').addEventListener('click', function (e) {
    if (e.target === this) this.classList.remove('show');
  });

  // 清理
  window.addEventListener('beforeunload', stopPolling);

})();
</script>
</body>
</html>
